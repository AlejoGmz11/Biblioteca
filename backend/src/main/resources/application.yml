spring:
  application:
    name: mylibrary-backend
  profiles:
    active: dev
  servlet:
    multipart:
      # Ebooks de hasta 100 MB; las imágenes siguen limitadas a 5 MB en LocalImageStorageStrategy
      max-file-size: 100MB
      max-request-size: 105MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3ItbXlsaWJyYXJ5LWRldi1vbmx5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLXBsZWFzZSE=}
    access-expiration-ms: 900000        # 15 min
    refresh-expiration-ms: 1800000      # 30 min: sin actividad, la sesión no se puede renovar
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  rate-limit:
    auth-requests-per-minute: 10
  # Enlace que llega por email: apunta al frontend
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  password-reset:
    token-expiration-minutes: 30
    from: ${MAIL_FROM:MyLibrary <no-reply@mylibrary.local>}
  ebook:
    max-size-mb: 100
    storage:
      bucket: ${EBOOK_S3_BUCKET:mylibrary-ebooks}
      region: ${EBOOK_S3_REGION:us-east-1}
      # Vacío en prod = AWS S3 real; en dev apunta a MinIO
      endpoint: ${EBOOK_S3_ENDPOINT:}
      access-key: ${EBOOK_S3_ACCESS_KEY:}
      secret-key: ${EBOOK_S3_SECRET_KEY:}
      path-style-access: ${EBOOK_S3_PATH_STYLE:false}
      create-bucket: ${EBOOK_S3_CREATE_BUCKET:false}

server:
  port: 8080
  error:
    include-stacktrace: never

logging:
  level:
    com.mylibrary: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/mylibrary
    username: mylibrary
    password: mylibrary
  mail:
    # Mailpit (docker-compose): captura los correos sin enviarlos
    host: localhost
    port: 1025

app:
  ebook:
    storage:
      endpoint: http://localhost:9000
      access-key: mylibrary
      secret-key: mylibrary123
      path-style-access: true
      create-bucket: true

logging:
  level:
    com.mylibrary: DEBUG
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

logging:
  level:
    com.mylibrary: INFO
