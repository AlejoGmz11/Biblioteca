<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>MyLibrary — Tu biblioteca personal</title>
  <base href="/"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="MyLibrary: gestiona tu biblioteca personal, registra tus lecturas y descubre tus estadísticas."/>
  <meta property="og:site_name" content="MyLibrary"/>
  <meta property="og:type" content="website"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237f4f24'%3E%3Cpath d='M4 3h13a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm1 2v14h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H5z'/%3E%3C/svg%3E"/>
  <script>
    // Apply persisted theme before first paint to avoid a flash
    try {
      var theme = localStorage.getItem('mylibrary-theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#7f4f24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MyLibrary" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <app-root></app-root>
  <noscript>MyLibrary necesita JavaScript para funcionar.</noscript>
</body>
</html>
